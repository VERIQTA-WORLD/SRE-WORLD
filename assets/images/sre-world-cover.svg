<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580" role="img" aria-labelledby="t d"><title id="t">SRE WORLD</title><desc id="d">Learn reliability. Measure outcomes. Investigate failures. Verify recovery.</desc><rect width="1600" height="580" fill="#081929"/><path d="M0 0H1600" stroke="#55e0b5" stroke-width="12"/><g font-family="Arial,sans-serif" font-weight="700"><text x="80" y="75" font-size="24" fill="#55e0b5">VERIQTA WORLD</text><text x="80" y="175" font-size="56" fill="#f3f8fd">SRE WORLD</text><text x="80" y="240" font-size="23" fill="#b6cddd">Learn reliability. Measure outcomes. Investigate failures. Verify recovery.</text><rect x="80" y="290" width="340" height="135" rx="18" fill="#13344a"/><text x="102" y="335" font-size="24" fill="#55e0b5">Understand</text><text x="102" y="378" font-size="18" fill="#e1edf7">Users and service goals</text><rect x="445" y="290" width="340" height="135" rx="18" fill="#13344a"/><text x="467" y="335" font-size="24" fill="#55e0b5">Measure</text><text x="467" y="378" font-size="18" fill="#e1edf7">SLIs and SLOs</text><rect x="810" y="290" width="340" height="135" rx="18" fill="#13344a"/><text x="832" y="335" font-size="24" fill="#55e0b5">Operate</text><text x="832" y="378" font-size="18" fill="#e1edf7">Evidence and decisions</text><rect x="1175" y="290" width="340" height="135" rx="18" fill="#13344a"/><text x="1197" y="335" font-size="24" fill="#55e0b5">Improve</text><text x="1197" y="378" font-size="18" fill="#e1edf7">Resilience and learning</text><text x="80" y="545" font-size="18" fill="#85a3b9">Understand the system. Explain the evidence. Defend the decision.</text></g></svg>